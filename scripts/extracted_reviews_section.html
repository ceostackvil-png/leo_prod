      if (!wrapper || wrapper.dataset.listingInitialized === 'true') return;

      wrapper.dataset.listingInitialized = 'true';

      const slider = initProductGridCarousel({
        root: wrapper.closest('[data-testid="product-listing-section"]') || document,

        onChange: function () {

      if (slider) {
        slider.updateDots = function () {
          const dots = this.wrapper.querySelectorAll('.dot');
          if (!dots.length) return;

          const activeIndex = Math.max(0, Math.min(this.getDotIndex(), dots.length - 1));

          dots.forEach((dot, index) => {
            dot.removeAttribute('style');
            dot.classList.toggle('product-listing-dot-active', index === activeIndex);
          });
        };
        slider.updateDots();
      }
    };

    initCustomListingSlider();
  });
